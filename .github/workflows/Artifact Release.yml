
name: Artifact Release

on:
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Signed APK (PKCS12)
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEY_BASE64"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEY_BASE64" | base64 --decode > app/release.p12
          trap 'rm -f app/release.p12' EXIT

          ALIAS=$(keytool -list -v \
            -storetype PKCS12 \
            -keystore app/release.p12 \
            -storepass "$KEY_PASSWORD" |
            sed -n 's/^Alias name: //p' | head -n 1)

          test -n "$ALIAS"

          echo "Certificate alias detected."

          ./gradlew clean assembleRelease \
            -PStoreFile="$GITHUB_WORKSPACE/app/release.p12" \
            -PStoreType=PKCS12 \
            -PStorePassword="$KEY_PASSWORD" \
            -PKeyPassword="$KEY_PASSWORD" \
            -PKeyAlias="$ALIAS"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          set -euo pipefail

          mkdir -p output

          cp app/build/outputs/apk/release/app-release.apk \
            "output/OwnerRoyall#${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: OwnerRoyall#${{ github.run_number }}
          path: output/OwnerRoyall#${{ github.run_number }}.apk
          retention-days: 10
          compression-level: 0
          overwrite: true
          if-no-files-found: error
