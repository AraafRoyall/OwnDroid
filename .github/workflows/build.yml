name: CI build

on:
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Signed APK (PKCS12)
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEY_BASE64"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEY_BASE64" | base64 --decode > app/release.p12
          trap 'rm -f app/release.p12' EXIT

          ALIAS=$(keytool -list -v \
            -storetype PKCS12 \
            -keystore app/release.p12 \
            -storepass "$KEY_PASSWORD" |
            sed -n 's/^Alias name: //p' | head -n 1)

          test -n "$ALIAS"

          echo "Certificate alias detected."

          ./gradlew clean assembleRelease \
            -PStoreFile="$GITHUB_WORKSPACE/app/release.p12" \
            -PStoreType=PKCS12 \
            -PStorePassword="$KEY_PASSWORD" \
            -PKeyPassword="$KEY_PASSWORD" \
            -PKeyAlias="$ALIAS"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Prepare Numbered Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LAST=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].name' |
            sed -nE 's/^OwnerRoyall#([0-9]+)$/\1/p' |
            sort -n | tail -n 1)

          LAST=${LAST:-0}
          NEXT=$((10#$LAST + 1))

          NAME="OwnerRoyall#$NEXT"
          TAG="ownerroyall-$NEXT"
          APK="$NAME.apk"

          mv app/build/outputs/apk/release/app-release.apk "$APK"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.release.outputs.apk }}
          body: |
            Automated signed APK build.

            Commit: ${{ github.sha }}