name: Dynamic Intent Filters Release

on:
  workflow_dispatch:

concurrency:
  group: dynamic-intent-filters-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/dynamic-intent-filters" || {
            echo "::error::Run this workflow from the dynamic-intent-filters branch."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build signed release APK
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEY_BASE64" || {
            echo "::error::Repository secret KEY_BASE64 is missing."
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "::error::Repository secret KEY_PASSWORD is missing."
            exit 1
          }

          printf '%s' "$KEY_BASE64" | base64 --decode > app/release.p12
          trap 'rm -f app/release.p12' EXIT

          ALIAS=$(keytool -list -v \
            -storetype PKCS12 \
            -keystore app/release.p12 \
            -storepass "$KEY_PASSWORD" |
            sed -n 's/^Alias name: //p' | head -n 1)

          test -n "$ALIAS" || {
            echo "::error::Could not detect the PKCS12 certificate alias."
            exit 1
          }

          ./gradlew --no-daemon clean assembleRelease \
            -PStoreFile="$GITHUB_WORKSPACE/app/release.p12" \
            -PStoreType=PKCS12 \
            -PStorePassword="$KEY_PASSWORD" \
            -PKeyPassword="$KEY_PASSWORD" \
            -PKeyAlias="$ALIAS"

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" "release/OwnDroid-Dynamic-Intent-Filters-${GITHUB_RUN_NUMBER}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: dynamic-intent-filters-${{ github.run_number }}
          name: Dynamic Intent Filters Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: release/OwnDroid-Dynamic-Intent-Filters-${{ github.run_number }}.apk
          body: |
            Automated signed APK build from the dynamic-intent-filters branch.

            Includes the unified Dynamic Intent Filters manager.
            Existing classic Cross-profile Intent Filters data is migrated on database upgrade.

            Commit: ${{ github.sha }}
